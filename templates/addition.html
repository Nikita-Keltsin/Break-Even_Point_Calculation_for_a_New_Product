<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/Break-Even_Point_Calculation_for_a_New_Product.css">
    <style>
        .media-zone { cursor: pointer; }
        .media-preview { width: 100%; border-radius: 10px; overflow: hidden; background: #FFFFFF; }
        .media-preview img, .media-preview video { width: 100%; height: 170px; object-fit: cover; display: block; }
        .media-zone.static { cursor: default; }
    </style>
</head>
<body>
<div class="app app-light">
    <div class="status-bar">
        <span class="sb-time">9:41</span>
        <span class="sb-icons">
            <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><path d="M6.5 9.5a2.5 2.5 0 0 1 3 0"/><circle cx="8" cy="11" r="0.8" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="currentColor"/><path d="M23.5 4v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" opacity=".45"/></svg>
        </span>
    </div>

    <h1 class="page-title">Добавление</h1>

    {{ if not .HasDraft }}
    <!-- ШАГ 1: название, фото, видео → «Далее». Фото/видео в ЛР-2 на сервер не передаются -->
    <div class="card">
        <b class="card-title">Фото и видео</b>
        <div class="media-stack">
            <div class="media-zone" onclick="document.getElementById('imageInput').click()">
                <span class="media-ico">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="13" height="12" rx="2"/><path d="M7 7l1.5-2h5L15 7"/><circle cx="9.5" cy="13" r="3"/><path d="M19 5v6M16 8h6"/></svg>
                </span>
                <span class="media-label">Загрузить фото</span>
                <span class="media-preview"><img id="imgPreview" src="{{ .ImageURL }}" alt=""></span>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none"
                   onchange="if(this.files&&this.files[0]){document.getElementById('imgPreview').src=URL.createObjectURL(this.files[0]);}">

            <div class="media-zone" onclick="document.getElementById('videoInput').click()">
                <span class="media-ico">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></svg>
                </span>
                <span class="media-label">Загрузить видео</span>
                <span class="media-preview"><video id="videoPreview" src="{{ .VideoURL }}" muted loop playsinline autoplay></video></span>
            </div>
            <input type="file" id="videoInput" accept="video/*" style="display:none"
                   onchange="if(this.files&&this.files[0]){document.getElementById('videoPreview').src=URL.createObjectURL(this.files[0]);}">
        </div>
    </div>

    <form action="/breakeven-point/draft" method="POST">
        <div class="card">
            <b class="card-title">Новый вид затрат</b>
            <label class="field-label">Название вида затрат</label>
            <input class="field" type="text" name="cost_name" required placeholder="Например: Аренда помещения">
            <button type="submit" class="btn" style="margin-top:16px">Далее</button>
        </div>
    </form>

    {{ else }}
    <!-- ШАГ 2: черновик уже есть → поля заполнены, краткое описание + 2 поля по теме → «Опубликовать» -->
    <div class="card">
        <b class="card-title">Фото и видео</b>
        <div class="media-stack">
            <div class="media-zone static">
                <span class="media-preview"><img src="{{ .ImageURL }}" alt=""
                      onerror="this.onerror=null;this.src='/static/media/default-image.png';"></span>
            </div>
            <div class="media-zone static">
                <span class="media-preview"><video src="{{ .VideoURL }}" muted loop playsinline autoplay
                      onerror="this.onerror=null;this.src='/static/media/default-video.mp4';"></video></span>
            </div>
        </div>
    </div>

    <form action="/breakeven-point/publish" method="POST">
        <div class="card">
            <b class="card-title">Черновик</b>
            <label class="field-label">Название вида затрат</label>
            <input class="field" type="text" value="{{ .Draft.CostName }}" readonly>

            <label class="field-label">Краткое описание</label>
            <textarea class="field" name="short_description" rows="3" required
                      placeholder="Что входит в эти затраты">{{ .Draft.Description }}</textarea>

            <label class="field-label">Сумма затрат, ₽/мес</label>
            <input class="field" type="number" name="amount_monthly" step="0.01" min="0" required
                   value="{{ .Draft.AmountValue }}">

            <label class="checkbox-field">
                <input type="checkbox" name="is_fixed" {{ if .Draft.Fixed }}checked{{ end }}>
                <span>Постоянные затраты (не зависят от объёма выпуска)</span>
            </label>

            <button type="submit" class="btn" style="margin-top:16px">Опубликовать</button>
        </div>
    </form>
    {{ end }}

    <nav class="bottom-nav">
        <a href="/breakeven-point/feed" class="nav-tab {{ if eq .Page "feed" }}active{{ end }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4z"/><path d="M2 4h20v4H2z"/><path d="M9 12h6"/></svg>
            Лента
        </a>
        <a href="/breakeven-point/addition" class="nav-tab {{ if eq .Page "addition" }}active{{ end }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            Добавление
        </a>
        <a href="/breakeven-point/cost-types" class="nav-tab {{ if eq .Page "costs" }}active{{ end }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
            Виды затрат
        </a>
    </nav>
</div>
</body>
</html>
