<<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Виды затрат</title>
    <link rel="stylesheet" href="/static/styles/Break-Even_Point_Calculation_for_a_New_Product.css">
    <style>
        .dual-range { position: relative; height: 34px; margin: 6px 0 12px; }
        .dual-range .track { position: absolute; left: 0; right: 0; top: 50%; height: 4px;
            transform: translateY(-50%); background: #D5DAE1; border-radius: 2px; }
        .dual-range input[type=range] { position: absolute; left: 0; right: 0; top: 50%;
            transform: translateY(-50%); width: 100%; margin: 0; height: 20px; background: none;
            pointer-events: none; -webkit-appearance: none; appearance: none; }
        .dual-range input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
            pointer-events: auto; width: 22px; height: 22px; border-radius: 50%; background: #2285C8;
            border: none; cursor: pointer; }
        .dual-range input[type=range]::-moz-range-thumb { pointer-events: auto; width: 22px; height: 22px;
            border-radius: 50%; background: #2285C8; border: none; cursor: pointer; }
        .dual-range input[type=range]::-moz-range-track { background: none; }
        .check-row.no-border { border-top: none; margin-top: 0; padding-top: 0; }
        .cost-card a, .cost-card a:visited { color: #1F2937; text-decoration: none; }
    </style>
</head>
<body>
<div class="app app-light">
    <div class="status-bar">
        <span class="sb-time">9:41</span>
        <span class="sb-icons">
            <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><path d="M6.5 9.5a2.5 2.5 0 0 1 3 0"/><circle cx="8" cy="11" r="0.8" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="currentColor"/><path d="M23.5 4v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" opacity=".45"/></svg>
        </span>
    </div>

    <h1 class="page-title">Виды затрат</h1>

    <form action="/breakeven-point/cost-types" method="GET" class="card filter-card">
        <div class="filter-head">
            <b>Фильтр по сумме и виду</b>
            <a class="reset-link" href="/breakeven-point/cost-types">Сбросить</a>
        </div>
        <div class="check-row no-border">
            <label class="check {{ if .FixedOn }}on{{ end }}">
                <input type="checkbox" name="type_fixed" {{ if .FixedOn }}checked{{ end }}> Постоянные
            </label>
            <label class="check {{ if .VarOn }}on{{ end }}">
                <input type="checkbox" name="type_variable" {{ if .VarOn }}checked{{ end }}> Переменные
            </label>
        </div>
        <div class="range-row" style="justify-content:space-between">
            <span class="field-label" style="margin:0">От: {{ .FromText }}</span>
            <span class="field-label" style="margin:0">До: {{ .ToText }}</span>
        </div>
        <div class="dual-range">
            <span class="track"></span>
            <input type="range" name="amount_from" min="0" max="8000000" step="50000" value="{{ .From }}">
            <input type="range" name="amount_to" min="0" max="8000000" step="50000" value="{{ .To }}">
        </div>
        <button type="submit" class="btn">Применить</button>
    </form>

    <div class="costs-grid">
        {{ range .Costs }}
        <div class="cost-card">
            <a class="cost-link" href="/breakeven-point/feed?id={{ .Cost.ID }}">
                <img src="{{ .ImageURL }}" onerror="this.onerror=null;this.src='/static/media/default-image.png';" alt="{{ .Cost.CostName }}">
                <b class="cost-name">{{ .Cost.CostName }}</b>
                <b class="cost-sum">{{ .Cost.AmountText }}</b>
            </a>
            <div class="cost-badge">
                <span class="kind-text">{{ .Cost.KindLabel }}</span>
                <span class="share-text">♥ {{ .LikesCount }}</span>
            </div>
            <form action="/breakeven-point/delete" method="POST">
                <input type="hidden" name="id" value="{{ .Cost.ID }}">
                <button type="submit" class="btn">Удалить</button>
            </form>
        </div>
        {{ else }}
        <div class="empty-state">Ничего не найдено. Измените фильтр.</div>
        {{ end }}
    </div>

    <nav class="bottom-nav">
        <a href="/breakeven-point/feed" class="nav-tab {{ if eq .Page "feed" }}active{{ end }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4z"/><path d="M2 4h20v4H2z"/><path d="M9 12h6"/></svg>
            Лента
        </a>
        <a href="/breakeven-point/addition" class="nav-tab {{ if eq .Page "addition" }}active{{ end }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            Добавление
        </a>
        <a href="/breakeven-point/cost-types" class="nav-tab {{ if eq .Page "costs" }}active{{ end }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
            Виды затрат
        </a>
    </nav>
</div>
</body>
</html>
